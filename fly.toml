# Fly.io: see docs/DEPLOYMENT.md
#   fly launch --no-deploy --copy-config
#   fly volumes create prototrip_data --size 1
#   fly secrets set ADMIN_PASSWORD='choose-a-strong-password'
#   fly deploy
app = "prototrip"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "3000"

[[mounts]]
  source = "prototrip_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
