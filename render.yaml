# Render Blueprint (used by the "Deploy to Render" button in the README).
# Runs on Render's free plan and stores the data in a free PostgreSQL database
# (e.g. Neon) – paste its connection string as DATABASE_URL when asked.
# See docs/DEPLOYMENT.md for details and for the paid "disk" alternative.
services:
  - type: web
    name: prototrip-schedule
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
