name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: prototrip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tester" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://tester:tester@localhost:5432/prototrip_test
      - run: npm run build
      - name: End-to-end test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run test:e2e
